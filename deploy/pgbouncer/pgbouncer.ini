[databases]
; Backend Postgres (not PgBouncer). Overridden by install-from-env.sh using PGBOUNCER_BACKEND_* / PGBOUNCER_DATABASE.
almadel = host=127.0.0.1 port=5432 dbname=almadel

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = postgres
pool_mode = transaction
max_client_conn = 2000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 600
ignore_startup_parameters = extra_float_digits,search_path,application_name

; App connection (see .env):
; DATABASE_URL=postgresql://USER:PASS@127.0.0.1:6432/almadel?schema=public&pgbouncer=true
; DATABASE_DIRECT_URL=postgresql://USER:PASS@127.0.0.1:5432/almadel?schema=public
; PGBOUNCER=true
; DB_POOL_MAX=10  (per Node process; keep PM2_INSTANCES × DB_POOL_MAX within default_pool_size headroom)
